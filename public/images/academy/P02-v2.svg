<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>先算责任，再讨论储备月份</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">先算责任，再讨论储备月份</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">确认收入、支出的金额和实际日期</text><rect x="100" y="330" width="750" height="150" rx="7" fill="#668078"/><rect x="850" y="330" width="250" height="150" rx="7" fill="#b18b47"/><text x="475" y="390" font-size="48" fill="white" text-anchor="middle" font-weight="400">12,000 × 3</text><text x="475" y="445" font-size="29" fill="white" text-anchor="middle" font-weight="400">三个月必要支出 36,000 元</text><text x="975" y="390" font-size="39" fill="white" text-anchor="middle" font-weight="400">10,000</text><text x="975" y="440" font-size="24" fill="white" text-anchor="middle" font-weight="400">其他确定付款</text><text x="600" y="600" font-size="56" fill="#302d29" text-anchor="middle" font-weight="600">合计 46,000 元</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">人民币假设算例；三个月不是统一储备标准</text></g></svg>