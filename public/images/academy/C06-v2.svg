<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>收入变化，先安排接下来四周</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">收入变化，先安排接下来四周</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">不要求今晚就替全部未来作保证</text><rect x="80" y="280" width="1040" height="350" rx="14" fill="white"/><text x="110" y="340" font-size="30" fill="#5a718c" text-anchor="start" font-weight="400">本周</text><line x1="110" y1="365" x2="110" y2="560" stroke="#ded8cb" stroke-width="2" stroke-dasharray=""/><text x="370" y="340" font-size="30" fill="#5a718c" text-anchor="start" font-weight="400">第二周</text><line x1="370" y1="365" x2="370" y2="560" stroke="#ded8cb" stroke-width="2" stroke-dasharray=""/><text x="630" y="340" font-size="30" fill="#5a718c" text-anchor="start" font-weight="400">第三周</text><line x1="630" y1="365" x2="630" y2="560" stroke="#ded8cb" stroke-width="2" stroke-dasharray=""/><text x="890" y="340" font-size="30" fill="#5a718c" text-anchor="start" font-weight="400">第四周</text><line x1="890" y1="365" x2="890" y2="560" stroke="#ded8cb" stroke-width="2" stroke-dasharray=""/><rect x="110" y="390" width="220" height="130" rx="16" fill="#efe3d4"/><text x="130" y="435" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">确认到账</text><text x="130" y="480" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">与必要付款</text><rect x="370" y="430" width="480" height="90" rx="16" fill="#e6ede8"/><text x="395" y="485" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">执行短期安排，保留变更信息</text><circle cx="1000" cy="460" r="65" fill="#b18b47"/><text x="1000" y="470" font-size="32" fill="white" text-anchor="middle" font-weight="400">复查</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>