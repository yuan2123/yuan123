<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>支付截图，不等于全部费用资料</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">支付截图，不等于全部费用资料</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">按实际用途确认接收方需要什么</text><rect x="150" y="270" width="450" height="390" rx="5" fill="white"/><text x="185" y="330" font-size="36" fill="#302d29" text-anchor="start" font-weight="600">费用资料</text><line x1="185" y1="380" x2="515" y2="380" stroke="#d8d1c4" stroke-width="12" stroke-dasharray=""/><line x1="185" y1="425" x2="455" y2="425" stroke="#d8d1c4" stroke-width="12" stroke-dasharray=""/><line x1="185" y1="470" x2="515" y2="470" stroke="#d8d1c4" stroke-width="12" stroke-dasharray=""/><line x1="185" y1="515" x2="365" y2="515" stroke="#d8d1c4" stroke-width="12" stroke-dasharray=""/><line x1="185" y1="560" x2="485" y2="560" stroke="#d8d1c4" stroke-width="12" stroke-dasharray=""/><line x1="600" y1="385" x2="710" y2="385" stroke="#5a718c" stroke-width="2" stroke-dasharray=""/><text x="740" y="395" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">支付记录</text><line x1="600" y1="475" x2="710" y2="475" stroke="#5a718c" stroke-width="2" stroke-dasharray=""/><text x="740" y="485" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">费用明细</text><line x1="600" y1="565" x2="710" y2="565" stroke="#5a718c" stroke-width="2" stroke-dasharray=""/><text x="740" y="575" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">正式票据与结算材料</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">资料类型示意，不代表所有申请要求相同</text></g></svg>