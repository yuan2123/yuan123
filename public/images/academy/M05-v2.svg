<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>出发之前，把两边的信息接起来</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">出发之前，把两边的信息接起来</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">跨省就医：参保地与就医机构分别确认</text><rect x="75" y="295" width="440" height="315" rx="16" fill="#e4eaf0"/><rect x="685" y="295" width="440" height="315" rx="16" fill="#e6ede7"/><line x1="515" y1="450" x2="685" y2="450" stroke="#b18b47" stroke-width="4" stroke-dasharray=""/><text x="110" y="360" font-size="40" fill="#302d29" text-anchor="start" font-weight="600">参保地</text><text x="110" y="435" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">办理类别与待遇</text><text x="110" y="500" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">备案状态与适用信息</text><text x="720" y="360" font-size="40" fill="#302d29" text-anchor="start" font-weight="600">就医地医院</text><text x="720" y="435" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">本次服务能否结算</text><text x="720" y="500" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">当天凭证与报到方式</text><text x="600" y="665" font-size="33" fill="#302d29" text-anchor="middle" font-weight="400">预约确认与医保结算，分两条线完成</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">国家层面框架示意；个人待遇与地方办理须当期核实</text></g></svg>