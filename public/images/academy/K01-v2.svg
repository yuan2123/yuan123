<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>同样十万元，用钱时间不同</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">同样十万元，用钱时间不同</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">先看什么时候要用，再考虑怎样安排</text><text x="68" y="340" font-size="32" fill="#302d29" text-anchor="start" font-weight="400">甲家庭</text><rect x="230" y="290" width="865" height="120" rx="10" fill="#668078"/><text x="265" y="338" font-size="38" fill="white" text-anchor="start" font-weight="600">10 万元</text><text x="265" y="382" font-size="29" fill="white" text-anchor="start" font-weight="400">装修付款</text><text x="1055" y="363" font-size="39" fill="white" text-anchor="end" font-weight="600">三个月后</text><text x="68" y="525" font-size="32" fill="#302d29" text-anchor="start" font-weight="400">乙家庭</text><rect x="230" y="475" width="865" height="120" rx="10" fill="#5a718c"/><text x="265" y="523" font-size="38" fill="white" text-anchor="start" font-weight="600">10 万元</text><text x="265" y="567" font-size="29" fill="white" text-anchor="start" font-weight="400">孩子上大学</text><text x="1055" y="548" font-size="39" fill="white" text-anchor="end" font-weight="600">预计十年后</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">虚构例子；两家的日常开支与备用金均已另外留好</text></g></svg>