<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>学习之后，行为多了哪一步？</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">学习之后，行为多了哪一步？</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">用具体决策变化评价，而非只看某次盈亏</text><rect x="90" y="290" width="390" height="300" rx="16" fill="#eee5d5"/><rect x="720" y="290" width="390" height="300" rx="16" fill="#e3ece6"/><line x1="510" y1="440" x2="690" y2="440" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 678 431 L 690 440 L 678 449" fill="none" stroke="#b18b47" stroke-width="3"/><text x="125" y="360" font-size="29" fill="#756e63" text-anchor="start" font-weight="400">原来只看</text><text x="125" y="430" font-size="39" fill="#302d29" text-anchor="start" font-weight="400">每月付多少</text><text x="755" y="360" font-size="29" fill="#756e63" text-anchor="start" font-weight="400">现在多查</text><text x="755" y="425" font-size="36" fill="#302d29" text-anchor="start" font-weight="400">总额 · 费用</text><text x="755" y="485" font-size="36" fill="#302d29" text-anchor="start" font-weight="400">期限 · 退出</text><text x="600" y="660" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">把一个真实决策做得更清楚</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>