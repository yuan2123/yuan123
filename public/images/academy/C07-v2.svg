<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>储蓄减少，也可能伴随债务下降</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">储蓄减少，也可能伴随债务下降</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">同时看资产、负债与眼前支付能力</text><text x="80" y="345" font-size="30" fill="#302d29" text-anchor="start" font-weight="400">可用储蓄</text><circle cx="400" cy="330" r="50.0" fill="#5a718c"/><circle cx="890" cy="330" r="35.0" fill="#5a718c"/><text x="400" y="420" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">50,000</text><text x="890" y="420" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">35,000</text><line x1="480" y1="330" x2="800" y2="330" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 788 321 L 800 330 L 788 339" fill="none" stroke="#b18b47" stroke-width="3"/><text x="80" y="485" font-size="30" fill="#302d29" text-anchor="start" font-weight="400">欠款</text><circle cx="400" cy="470" r="40.0" fill="#af7466"/><circle cx="890" cy="470" r="15.0" fill="#af7466"/><text x="400" y="560" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">40,000</text><text x="890" y="560" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">15,000</text><line x1="480" y1="470" x2="800" y2="470" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 788 461 L 800 470 L 788 479" fill="none" stroke="#b18b47" stroke-width="3"/><text x="400" y="270" font-size="28" fill="#756e63" text-anchor="middle" font-weight="400">去年末</text><text x="890" y="270" font-size="28" fill="#756e63" text-anchor="middle" font-weight="400">今年末</text><text x="600" y="660" font-size="36" fill="#668078" text-anchor="middle" font-weight="400">净现金位置：10,000 → 20,000 元</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">人民币简化算例；忽略其他变动，不代表全部财务情况</text></g></svg>