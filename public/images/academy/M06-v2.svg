<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>一份费用，两套规则分别核实</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">一份费用，两套规则分别核实</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">个人支付金额，不能直接推定为商业赔付金额</text><rect x="70" y="280" width="1060" height="100" rx="16" fill="#eee5d4"/><text x="600" y="342" font-size="37" fill="#302d29" text-anchor="middle" font-weight="400">实际费用 · 结算记录 · 本人资料</text><line x1="600" y1="380" x2="600" y2="430" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><line x1="300" y1="430" x2="900" y2="430" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><rect x="80" y="465" width="440" height="165" rx="16" fill="#5a718c"/><text x="300" y="525" font-size="34" fill="white" text-anchor="middle" font-weight="400">基本医保</text><text x="300" y="580" font-size="27" fill="white" text-anchor="middle" font-weight="400">本人待遇与本次结算</text><rect x="680" y="465" width="440" height="165" rx="16" fill="#668078"/><text x="900" y="525" font-size="34" fill="white" text-anchor="middle" font-weight="400">商业医疗保险</text><text x="900" y="580" font-size="27" fill="white" text-anchor="middle" font-weight="400">具体合同与申请条件</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>