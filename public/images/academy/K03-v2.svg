<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>三种记录，别把一笔钱算三遍</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">三种记录，别把一笔钱算三遍</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">以可追溯的真实消费为线索</text><rect x="80" y="270" width="270" height="300" rx="16" fill="#e4eaf0"/><rect x="465" y="270" width="270" height="300" rx="16" fill="#e7eee8"/><rect x="850" y="270" width="270" height="300" rx="16" fill="#f1e5d2"/><text x="110" y="330" font-size="34" fill="#302d29" text-anchor="start" font-weight="600">银行流水</text><text x="110" y="410" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">到账、转账</text><text x="110" y="470" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">还款记录</text><text x="495" y="330" font-size="34" fill="#302d29" text-anchor="start" font-weight="600">支付账单</text><text x="495" y="410" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">实际消费</text><text x="495" y="470" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">退款记录</text><text x="880" y="330" font-size="34" fill="#302d29" text-anchor="start" font-weight="600">家庭盘点</text><text x="880" y="410" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">关联同一笔钱</text><text x="880" y="470" font-size="28" fill="#302d29" text-anchor="start" font-weight="400">消费只计一次</text><line x1="355" y1="420" x2="450" y2="420" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 438 411 L 450 420 L 438 429" fill="none" stroke="#b18b47" stroke-width="3"/><line x1="740" y1="420" x2="835" y2="420" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 823 411 L 835 420 L 823 429" fill="none" stroke="#b18b47" stroke-width="3"/><text x="600" y="650" font-size="32" fill="#302d29" text-anchor="middle" font-weight="400">转账 ≠ 新消费；还款 ≠ 再买一次</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>