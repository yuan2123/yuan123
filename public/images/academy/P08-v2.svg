<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>多项责任，可能依赖同一笔收入</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">多项责任，可能依赖同一笔收入</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">收入份数不等于来源彼此独立</text><circle cx="220" cy="445" r="110" fill="#b18b47"/><text x="220" y="430" font-size="35" fill="white" text-anchor="middle" font-weight="400">收入来源</text><text x="220" y="480" font-size="28" fill="white" text-anchor="middle" font-weight="400">是否集中？</text><line x1="330" y1="445" x2="530" y2="300" stroke="#b8af9e" stroke-width="3" stroke-dasharray=""/><circle cx="600" cy="300" r="80" fill="#5a718c"/><text x="600" y="310" font-size="29" fill="white" text-anchor="middle" font-weight="400">住房责任</text><line x1="330" y1="445" x2="910" y2="350" stroke="#b8af9e" stroke-width="3" stroke-dasharray=""/><circle cx="980" cy="350" r="80" fill="#668078"/><text x="980" y="360" font-size="29" fill="white" text-anchor="middle" font-weight="400">日常生活</text><line x1="330" y1="445" x2="580" y2="585" stroke="#b8af9e" stroke-width="3" stroke-dasharray=""/><circle cx="650" cy="585" r="80" fill="#af7466"/><text x="650" y="595" font-size="29" fill="white" text-anchor="middle" font-weight="400">照护安排</text><line x1="330" y1="445" x2="950" y2="600" stroke="#b8af9e" stroke-width="3" stroke-dasharray=""/><circle cx="1020" cy="600" r="80" fill="#5a718c"/><text x="1020" y="610" font-size="29" fill="white" text-anchor="middle" font-weight="400">既有偿债</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>