<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>给父母考虑保障，先看三个层面</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">给父母考虑保障，先看三个层面</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">不是只比较第一年的报价</text><circle cx="120" cy="320" r="30" fill="#668078"/><text x="120" y="330" font-size="29" fill="white" text-anchor="middle" font-weight="400">1</text><text x="185" y="305" font-size="34" fill="#302d29" text-anchor="start" font-weight="600">已有安排</text><text x="185" y="357" font-size="30" fill="#756e63" text-anchor="start" font-weight="400">医保、现有合同与可用资金</text><circle cx="120" cy="445" r="30" fill="#b18b47"/><text x="120" y="455" font-size="29" fill="white" text-anchor="middle" font-weight="400">2</text><text x="185" y="430" font-size="34" fill="#302d29" text-anchor="start" font-weight="600">能否适用</text><text x="185" y="482" font-size="30" fill="#756e63" text-anchor="start" font-weight="400">年龄、健康条件与真实责任</text><circle cx="120" cy="570" r="30" fill="#5a718c"/><text x="120" y="580" font-size="29" fill="white" text-anchor="middle" font-weight="400">3</text><text x="185" y="555" font-size="34" fill="#302d29" text-anchor="start" font-weight="600">持续成本</text><text x="185" y="607" font-size="30" fill="#756e63" text-anchor="start" font-weight="400">缴费、续保相关约定和预算</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>