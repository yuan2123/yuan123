<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>先确认，两个人在说哪一笔钱</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">先确认，两个人在说哪一笔钱</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">把对象、事项、期限放回同一句话</text><rect x="80" y="275" width="475" height="315" rx="16" fill="#e7eee8"/><rect x="645" y="275" width="475" height="315" rx="16" fill="#e5ebf0"/><text x="125" y="345" font-size="35" fill="#302d29" text-anchor="start" font-weight="400">“下学期的活动”</text><text x="125" y="425" font-size="56" fill="#668078" text-anchor="start" font-weight="600">8,000 元</text><text x="125" y="500" font-size="25" fill="#756e63" text-anchor="start" font-weight="400">近期、具体、已取得报价</text><text x="690" y="345" font-size="35" fill="#302d29" text-anchor="start" font-weight="400">“十几年后的教育”</text><text x="690" y="425" font-size="44" fill="#5a718c" text-anchor="start" font-weight="600">金额待讨论</text><text x="690" y="500" font-size="25" fill="#756e63" text-anchor="start" font-weight="400">远期、可调整、条件未定</text><text x="600" y="655" font-size="32" fill="#302d29" text-anchor="middle" font-weight="400">同一句“为了孩子”，可能不是同一笔钱</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">虚构沟通情境；近期费用为人民币假设</text></g></svg>