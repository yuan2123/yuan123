<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>三个月空档，别漏首薪到账前</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">三个月空档，别漏首薪到账前</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">开始工作和第一笔工资到账，不一定是同一天</text><rect x="80" y="320" width="240" height="165" rx="12" fill="#e2e9ec"/><text x="200" y="380" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">空档月 1</text><text x="200" y="440" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">10,000 元</text><rect x="360" y="320" width="240" height="165" rx="12" fill="#e2e9ec"/><text x="480" y="380" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">空档月 2</text><text x="480" y="440" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">10,000 元</text><rect x="640" y="320" width="240" height="165" rx="12" fill="#e2e9ec"/><text x="760" y="380" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">空档月 3</text><text x="760" y="440" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">10,000 元</text><rect x="920" y="320" width="240" height="165" rx="12" fill="#eee0c8"/><text x="1040" y="380" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">首薪前过渡</text><text x="1040" y="440" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">10,000 元</text><text x="600" y="565" font-size="34" fill="#5a718c" text-anchor="middle" font-weight="400">学习及转换成本 10,000 元</text><text x="600" y="640" font-size="45" fill="#b18b47" text-anchor="middle" font-weight="600">本情境合计：50,000 元</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><tex