<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>一笔钱，先回答三个实际问题</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">一笔钱，先回答三个实际问题</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">金额、时间与退出规则，放在同一次判断里</text><circle cx="600" cy="310" r="65" fill="#b18b47"/><text x="600" y="320" font-size="32" fill="white" text-anchor="middle" font-weight="400">用途</text><line x1="600" y1="375" x2="270" y2="450" stroke="#b7ad9a" stroke-width="3" stroke-dasharray=""/><rect x="125" y="450" width="290" height="110" rx="16" fill="#e5ebe7"/><text x="270" y="515" font-size="31" fill="#302d29" text-anchor="middle" font-weight="400">何时用钱</text><line x1="600" y1="375" x2="600" y2="520" stroke="#b7ad9a" stroke-width="3" stroke-dasharray=""/><rect x="455" y="520" width="290" height="110" rx="16" fill="#e5ebe7"/><text x="600" y="585" font-size="31" fill="#302d29" text-anchor="middle" font-weight="400">承担什么损失</text><line x1="600" y1="375" x2="930" y2="450" stroke="#b7ad9a" stroke-width="3" stroke-dasharray=""/><rect x="785" y="450" width="290" height="110" rx="16" fill="#e5ebe7"/><text x="930" y="515" font-size="31" fill="#302d29" text-anchor="middle" font-weight="400">何时能退出</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>