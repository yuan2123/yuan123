<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>把一天摊开，才看得见空档</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">把一天摊开，才看得见空档</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">周二生活协助排班示例：中间六小时尚需协调</text><rect x="90" y="365" width="272" height="180" rx="8" fill="#668078"/><text x="230.0" y="430" font-size="30" fill="white" text-anchor="middle" font-weight="400">08:00—12:00</text><text x="230.0" y="490" font-size="28" fill="white" text-anchor="middle" font-weight="400">已有人安排</text><rect x="370" y="365" width="412" height="180" rx="8" fill="#af7466"/><text x="580.0" y="430" font-size="30" fill="white" text-anchor="middle" font-weight="400">12:00—18:00</text><text x="580.0" y="490" font-size="28" fill="white" text-anchor="middle" font-weight="400">尚需协调</text><rect x="790" y="365" width="272" height="180" rx="8" fill="#5a718c"/><text x="930.0" y="430" font-size="30" fill="white" text-anchor="middle" font-weight="400">18:00—22:00</text><text x="930.0" y="490" font-size="28" fill="white" text-anchor="middle" font-weight="400">已有人安排</text><text x="600" y="630" font-size="35" fill="#302d29" text-anchor="middle" font-weight="400">愿意帮忙，还要能接上具体时段</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">生活安排示例，不是护理方案；专业任务由适当人员承担</text></g></svg>