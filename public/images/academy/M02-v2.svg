<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>让每份资料找到正确的位置</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">让每份资料找到正确的位置</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">按人、就诊事项与日期建立索引</text><text x="120" y="310" font-size="37" fill="#302d29" text-anchor="start" font-weight="600">家人甲</text><line x1="170" y1="330" x2="170" y2="610" stroke="#5a718c" stroke-width="4" stroke-dasharray=""/><line x1="170" y1="390" x2="300" y2="390" stroke="#5a718c" stroke-width="3" stroke-dasharray=""/><rect x="300" y="345" width="760" height="90" rx="8" fill="#e7ece7"/><text x="335" y="402" font-size="32" fill="#668078" text-anchor="start" font-weight="400">2026-03 · 某次就诊</text><line x1="170" y1="505" x2="300" y2="505" stroke="#5a718c" stroke-width="3" stroke-dasharray=""/><rect x="300" y="460" width="760" height="90" rx="8" fill="#e7ece7"/><text x="335" y="517" font-size="32" fill="#b18b47" text-anchor="start" font-weight="400">2026-06 · 另一事项</text><line x1="170" y1="620" x2="300" y2="620" stroke="#5a718c" stroke-width="3" stroke-dasharray=""/><rect x="300" y="575" width="760" height="90" rx="8" fill="#e7ece7"/><text x="335" y="632" font-size="32" fill="#5a718c" text-anchor="start" font-weight="400">原件位置与获取方式</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">虚构目录示意，不展示真实健康信息</text></g></svg>