<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>别让一句口头安慰替你作答</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">别让一句口头安慰替你作答</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">如实回答，保留依据；不自行解释医学结果</text><rect x="80" y="280" width="460" height="330" rx="16" fill="#e4eaf0"/><text x="115" y="345" font-size="38" fill="#5a718c" text-anchor="start" font-weight="600">问清楚</text><text x="115" y="410" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">题目版本 · 报告原文</text><text x="115" y="465" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">具体不确定的那一项</text><rect x="660" y="280" width="460" height="330" rx="16" fill="#e6ede7"/><text x="695" y="345" font-size="38" fill="#668078" text-anchor="start" font-weight="600">留得下</text><text x="695" y="410" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">正式渠道 · 问题与答复</text><text x="695" y="465" font-size="29" fill="#302d29" text-anchor="start" font-weight="400">日期 · 已提交资料</text><line x1="555" y1="445" x2="645" y2="445" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 633 436 L 645 445 L 633 454" fill="none" stroke="#b18b47" stroke-width="3"/><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>