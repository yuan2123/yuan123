<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>最终承担多少，与今天要付多少</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">最终承担多少，与今天要付多少</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">本例医院费用 60,000；医保支付 18,000；后续补偿 25,000</text><line x1="170" y1="455" x2="1050" y2="455" stroke="#b9b09e" stroke-width="5" stroke-dasharray=""/><circle cx="180" cy="455" r="18" fill="#5a718c"/><text x="180" y="350" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">住院付款</text><text x="180" y="540" font-size="30" fill="#5a718c" text-anchor="middle" font-weight="400">累计支出 20,000</text><circle cx="600" cy="455" r="18" fill="#b18b47"/><text x="600" y="350" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">出院结算</text><text x="600" y="540" font-size="30" fill="#b18b47" text-anchor="middle" font-weight="400">累计支出 42,000</text><circle cx="1020" cy="455" r="18" fill="#668078"/><text x="1020" y="350" font-size="30" fill="#302d29" text-anchor="middle" font-weight="400">假设补偿到账</text><text x="1020" y="540" font-size="30" fill="#668078" text-anchor="middle" font-weight="400">净支出 17,000</text><text x="600" y="630" font-size="37" fill="#302d29" text-anchor="middle" font-weight="400">到账前需要的钱 ≠ 最终净负担</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">人民币虚构算例，不代表任何实际合同、报销比例或理赔时效</text></g></svg>