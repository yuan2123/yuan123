<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>三项计划，差七千元</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">三项计划，差七千元</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">可安排 30,000 元，原计划合计 37,000 元</text><rect x="90" y="300" width="1000" height="88" rx="8" fill="#668078"/><text x="120" y="357" font-size="31" fill="white" text-anchor="start" font-weight="400">确定付款</text><text x="1060" y="357" font-size="31" fill="white" text-anchor="end" font-weight="400">12,000 元</text><rect x="240" y="430" width="850" height="88" rx="8" fill="#b18b47"/><text x="270" y="487" font-size="31" fill="white" text-anchor="start" font-weight="400">生活改造</text><text x="1060" y="487" font-size="31" fill="white" text-anchor="end" font-weight="400">10,000 元</text><rect x="400" y="560" width="690" height="88" rx="8" fill="#af7466"/><text x="430" y="617" font-size="31" fill="white" text-anchor="start" font-weight="400">希望旅行</text><text x="1060" y="617" font-size="31" fill="white" text-anchor="end" font-weight="400">15,000 元</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">人民币假设算例；先区分已确定、可调整与可延期</text></g></svg>