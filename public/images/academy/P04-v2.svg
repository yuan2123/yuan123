<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>保额不能加成一个现金账户</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">保额不能加成一个现金账户</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">目录先区分：谁、什么条件、怎样给付、到何时</text><rect x="95" y="265" width="1010" height="385" rx="10" fill="white"/><rect x="120" y="295" width="270" height="90" rx="8" fill="#668078"/><text x="255" y="352" font-size="28" fill="white" text-anchor="middle" font-weight="400">医疗费用责任</text><text x="445" y="352" font-size="30" fill="#302d29" text-anchor="start" font-weight="400">结合实际费用与合同</text><line x1="420" y1="385" x2="1050" y2="385" stroke="#e2dbce" stroke-width="1" stroke-dasharray=""/><rect x="120" y="415" width="270" height="90" rx="8" fill="#b18b47"/><text x="255" y="472" font-size="28" fill="white" text-anchor="middle" font-weight="400">疾病给付责任</text><text x="445" y="472" font-size="30" fill="#302d29" text-anchor="start" font-weight="400">核对约定触发条件</text><line x1="420" y1="505" x2="1050" y2="505" stroke="#e2dbce" stroke-width="1" stroke-dasharray=""/><rect x="120" y="535" width="270" height="90" rx="8" fill="#5a718c"/><text x="255" y="592" font-size="28" fill="white" text-anchor="middle" font-weight="400">身故等责任</text><text x="445" y="592" font-size="30" fill="#302d29" text-anchor="start" font-weight="400">核对对象、条件与受益安排</text><line x1="420" y1="625" x2="1050" y2="625" stroke="#e2dbce" stroke-width="1" stroke-dasharray=""/><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">责任分类示意，实际以适用规则与具体合同为准</text></g></svg>