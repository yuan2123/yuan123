<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>涨薪三千，月承诺多了三千四</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">涨薪三千，月承诺多了三千四</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">四项新增支出，合计 3,400 元</text><line x1="100" y1="600" x2="1100" y2="600" stroke="#c8c0b2" stroke-width="2" stroke-dasharray=""/><rect x="110" y="320.0" width="130" height="240.0" rx="4" fill="#668078"/><text x="175" y="630" font-size="25" fill="#302d29" text-anchor="middle" font-weight="400">涨薪</text><text x="175" y="302.0" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">+3000</text><rect x="310" y="320.0" width="130" height="120.0" rx="4" fill="#af7466"/><text x="375" y="630" font-size="25" fill="#302d29" text-anchor="middle" font-weight="400">住房通勤</text><text x="375" y="302.0" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">-1500</text><rect x="510" y="440.0" width="130" height="64.0" rx="4" fill="#af7466"/><text x="575" y="630" font-size="25" fill="#302d29" text-anchor="middle" font-weight="400">自选活动</text><text x="575" y="422.0" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">-800</text><rect x="710" y="504.0" width="130" height="24.0" rx="4" fill="#af7466"/><text x="775" y="630" font-size="25" fill="#302d29" text-anchor="middle" font-weight="400">订阅</text><text x="775" y="486.0" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">-300</text><rect x="910" y="528.0" width="130" height="64.0" rx="4" fill="#af7466"/><text x="975" y="630" font-size="25" fill="#302d29" text-anchor="middle" font-weight="400">外出消费</text><text x="975" y="510.0" font-size="29" fill="#302d29" text-anchor="middle" font-weight="400">-800</text><text x="1020" y="280" font-size="47" fill="#af7466" text-anchor="end" font-weight="400">−400 元</text><text x="1020" y="325" font-size="27" fill="#756e63" text-anchor="end" font-weight="400">新增月承诺超过涨薪</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">人民币假设算例；按月预算与实际付款日须分别安排</text></g></svg>