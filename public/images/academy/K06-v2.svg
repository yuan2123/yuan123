<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>先看还款后还能留下多少</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">先看还款后还能留下多少</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">余额 10 万，已知付款 3 万；仅比较现金余量</text><line x1="160" y1="620" x2="1090" y2="620" stroke="#c8c0b2" stroke-width="2" stroke-dasharray=""/><rect x="160" y="572.8571428571429" width="180" height="47.14285714285714" rx="6" fill="#af7466"/><text x="250" y="547.8571428571429" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">10,000 元</text><text x="250" y="675" font-size="28" fill="#302d29" text-anchor="middle" font-weight="400">提前还 6 万</text><rect x="510" y="431.42857142857144" width="180" height="188.57142857142856" rx="6" fill="#b18b47"/><text x="600" y="406.42857142857144" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">40,000 元</text><text x="600" y="675" font-size="28" fill="#302d29" text-anchor="middle" font-weight="400">提前还 3 万</text><rect x="860" y="290.0" width="180" height="330.0" rx="6" fill="#668078"/><text x="950" y="265.0" font-size="34" fill="#302d29" text-anchor="middle" font-weight="400">70,000 元</text><text x="950" y="675" font-size="28" fill="#302d29" text-anchor="middle" font-weight="400">暂不提前还</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">人民币假设算例；尚未计入利息节省、费用及合同限制</text></g></svg>