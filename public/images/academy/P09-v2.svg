<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>验证别只走对方给出的那条路</title><rect width="1200" height="800" fill="#faf7ef"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="64" y="72" font-size="24" fill="#b18b47" text-anchor="start" font-weight="400">星火财商 / 财商学院</text><text x="64" y="150" font-size="48" fill="#302d29" text-anchor="start" font-weight="600">验证别只走对方给出的那条路</text><text x="66" y="198" font-size="27" fill="#756e63" text-anchor="start" font-weight="400">真实主体存在，也不自动证明眼前交易属于它</text><circle cx="195" cy="430" r="100" fill="#af7466"/><text x="195" y="430" font-size="28" fill="white" text-anchor="middle" font-weight="400">收到推荐</text><line x1="300" y1="430" x2="340" y2="430" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 328 421 L 340 430 L 328 439" fill="none" stroke="#b18b47" stroke-width="3"/><circle cx="475" cy="430" r="100" fill="#5a718c"/><text x="475" y="430" font-size="28" fill="white" text-anchor="middle" font-weight="400">独立找官方</text><text x="475" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="400">入口</text><line x1="580" y1="430" x2="620" y2="430" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 608 421 L 620 430 L 608 439" fill="none" stroke="#b18b47" stroke-width="3"/><circle cx="755" cy="430" r="100" fill="#668078"/><text x="755" y="430" font-size="28" fill="white" text-anchor="middle" font-weight="400">核对身份与</text><text x="755" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="400">范围</text><line x1="860" y1="430" x2="900" y2="430" stroke="#b18b47" stroke-width="3" stroke-dasharray=""/><path d="M 888 421 L 900 430 L 888 439" fill="none" stroke="#b18b47" stroke-width="3"/><circle cx="1035" cy="430" r="100" fill="#b18b47"/><text x="1035" y="430" font-size="28" fill="white" text-anchor="middle" font-weight="400">再看交易与</text><text x="1035" y="475" font-size="28" fill="white" text-anchor="middle" font-weight="400">收款</text><line x1="64" y1="710" x2="1136" y2="710" stroke="#ddd4c4" stroke-width="1" stroke-dasharray=""/><text x="64" y="752" font-size="23" fill="#756e63" text-anchor="start" font-weight="400">整理示意，须结合本文和实际情况理解</text></g></svg>