<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星火财商课程报名</title>
    <style>
      body { font-family: "Microsoft YaHei", sans-serif; background: #f8f4ea; margin: 0; padding: 32px; }
      .card { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e8dfce; border-radius: 20px; padding: 28px; }
      h1 { margin-top: 0; }
      label { display: block; margin-bottom: 14px; font-size: 14px; }
      input, select, textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; }
      button { margin-top: 10px; padding: 12px 18px; border: 0; border-radius: 999px; background: #b58a35; color: #fff; font-weight: 700; cursor: pointer; }
      .msg { margin-top: 14px; font-size: 14px; }
      .ok { color: #58714a; }
      .err { color: #8b3a3a; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>星火财商课程报名</h1>
      <p>此页面用于测试跨域报名接口。</p>
      <form id="form">
        <label>姓名<input name="name" required value="张三" /></label>
        <label>手机号<input name="phone" required value="13800138000" /></label>
        <label>年龄<input name="age" type="number" required value="30" /></label>
        <label>
          性别
          <select name="gender">
            <option>男</option>
            <option>女</option>
            <option>其他</option>
          </select>
        </label>
        <label><input name="attendedBefore" type="checkbox" /> 曾参加过相关课程</label>
        <label><input name="consent" type="checkbox" checked required /> 我已阅读并同意隐私授权</label>
        <label>来源<input name="source" value="线下活动" /></label>
        <label>备注<textarea name="remark" rows="3">希望了解家庭资产配置课程</textarea></label>
        <button type="submit">提交报名</button>
      </form>
      <p id="msg" class="msg"></p>
    </div>

    <script>
      const API_BASE = window.location.origin;

      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const formData = new FormData(form);
        const msg = document.getElementById("msg");
        msg.textContent = "提交中...";
        msg.className = "msg";

        try {
          const response = await fetch(`${API_BASE}/api/registrations`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: formData.get("name"),
              phone: formData.get("phone"),
              age: Number(formData.get("age")),
              gender: formData.get("gender"),
              attendedBefore: formData.get("attendedBefore") === "on",
              consent: formData.get("consent") === "on",
              source: formData.get("source"),
              remark: formData.get("remark"),
            }),
          });

          const result = await response.json();
          if (!response.ok) {
            msg.textContent = result.error || "提交失败";
            msg.className = "msg err";
            return;
          }

          msg.textContent = result.message || "提交成功";
          msg.className = "msg ok";
        } catch (error) {
          msg.textContent = "网络异常：" + error.message;
          msg.className = "msg err";
        }
      });
    </script>
  </body>
</html>
